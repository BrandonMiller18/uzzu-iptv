name: Release

# Tag vX.Y.Z (optionally -prerelease) -> signed release APK attached to a GitHub Release named after
# the tag. The app's in-app updater reads releases/latest and downloads the .apk asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same as CI: the runner's preinstalled SDK (setup-android@v3 breaks on current cmdline-tools).
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "UZZU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          UZZU_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          UZZU_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          UZZU_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        # versionCode is derived from versionName in app/build.gradle.kts (1.2.3 -> 10203).
        run: ./gradlew --no-configuration-cache assembleRelease -PversionName="$TAG"

      - name: Verify signature and rename
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK missing (unsigned build?):"; ls -l app/build/outputs/apk/release/
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          out="dist/uzzu-iptv-$VERSION.apk"
          cp "$apk" "$out"
          (cd dist && sha256sum "uzzu-iptv-$VERSION.apk" > "uzzu-iptv-$VERSION.apk.sha256")
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --verify-tag --generate-notes $prerelease
          fi

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            app/build/reports/
            app/build/test-results/
