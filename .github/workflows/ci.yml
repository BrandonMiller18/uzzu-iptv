name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK (ANDROID_HOME); AGP downloads missing
      # platforms itself. setup-android@v3 breaks on the current cmdline-tools.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, assemble (debug + unsigned R8 release)
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug assembleRelease

      # Debug-only hooks (fixture mode, URL feed, forced-404) must never reach the release dex.
      - name: Release APK has no debug hooks
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if unzip -p "$apk" 'classes*.dex' | grep -a -q -E 'uzzu-debug-missing|DEBUG_BREAK_NEXT_TUNE|debug_playlist_url|uzzu[.]fixture|suppress_errors'; then
            echo "::error::debug hook strings found in the release dex"; exit 1
          fi
          if unzip -l "$apk" | grep -q -E 'assets/sample[.]m3u|assets/espn/'; then
            echo "::error::fixture assets found in the release APK"; exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uzzu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
