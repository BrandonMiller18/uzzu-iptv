<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Channel row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75..100,400..700&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 840px; height: 104px; box-sizing: border-box; padding: {{borderWidth}}; background: {{borderColor}}; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); transform: {{transform}}; color: #E6F0F2; font-family: Roboto, sans-serif">
  <div style="width: 100%; height: 100%; box-sizing: border-box; padding: 0 28px 0 20px; background: #0E0E11; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); display: flex; align-items: center; gap: 20px">
    <span style="flex: none; width: 40px; font-family: 'Roboto Mono', monospace; font-size: 24px; line-height: 32px; color: #A99BBE">{{index}}</span>
    <div style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border: 2px solid #3A1E4F; background: #000000; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#A99BBE" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M3 6h18v12H3z"></path><path d="M8 21h8M9 2l3 4 3-4"></path></svg>
    </div>
    <span style="flex: 1; min-width: 0; font-size: 28px; line-height: 36px; font-weight: 600; font-stretch: 85%; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{channel}}</span>
    <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
      <span style="flex: none; font-size: 24px; line-height: 32px; font-weight: 800; font-stretch: 80%; letter-spacing: 2px; padding: 2px 12px; background: #B0186E; color: #E6F0F2; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%)">PLAYING</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"channel":{"editor":"text","default":"FanDuel Sports Network Wisconsin Extra"},"index":{"editor":"text","default":"01"},"focused":{"editor":"boolean","default":false},"playing":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F5E50A","options":["#F5E50A","#00E5FF","#FF2E88"]},"$preview":{"width":840,"height":104}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const focused = p.focused === true || p.focused === 'true';
    const accent = p.accent ?? '#F5E50A';
    return {
      channel: p.channel ?? 'FanDuel Sports Network Wisconsin Extra',
      index: p.index ?? '01',
      playing: p.playing === true || p.playing === 'true',
      borderColor: focused ? accent : '#3A1E4F',
      borderWidth: focused ? '6px' : '2px',
      transform: focused ? 'scale(1.05)' : 'none'
    };
  }
}
</script>
</body>
</html>
