<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75..100,400..700&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 840px; height: 188px; box-sizing: border-box; padding: {{borderWidth}}; background: {{borderColor}}; clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px)); transform: {{transform}}; color: #E6F0F2; font-family: Roboto, sans-serif">
  <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; padding: 0 32px 0 24px; background: #0E0E11; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px)); display: flex; align-items: center">
    <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; top: 0; right: 0; height: 44px; box-sizing: border-box; padding: 0 40px 0 22px; font-size: 24px; line-height: 32px; font-weight: 800; font-stretch: 80%; letter-spacing: 2px; background: {{accent}}; color: #000000; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #000000"></span>LIVE</span>
    </sc-if>
    <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 24px; opacity: {{opacity}}">

      <sc-if value="{{isMatchup}}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 20px; min-width: 0">
            <div style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border: 2px solid #3A1E4F; background: #000000; display: flex; align-items: center; justify-content: center">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#A99BBE" stroke-width="1.75" stroke-linejoin="miter" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"></path></svg>
            </div>
            <span style="font-size: 28px; line-height: 36px; font-weight: 600; font-stretch: 85%; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{away}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 20px; min-width: 0">
            <div style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border: 2px solid #3A1E4F; background: #000000; display: flex; align-items: center; justify-content: center">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#A99BBE" stroke-width="1.75" stroke-linejoin="miter" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"></path></svg>
            </div>
            <span style="font-size: 28px; line-height: 36px; font-weight: 600; font-stretch: 85%; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-family: 'Roboto Mono', monospace; font-weight: 500; color: #A99BBE">@ </span>{{home}}</span>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isUngrouped}}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 20px">
          <div style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border: 2px solid #3A1E4F; background: #000000; display: flex; align-items: center; justify-content: center">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#A99BBE" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M3 6h18v12H3z"></path><path d="M8 21h8M9 2l3 4 3-4"></path></svg>
          </div>
          <span style="font-size: 28px; line-height: 36px; font-weight: 600; font-stretch: 85%; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{away}}</span>
        </div>
      </sc-if>

      <div style="width: 200px; align-self: stretch; padding: 26px 0; box-sizing: border-box; flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 4px">
        <span style="font-family: 'Roboto Mono', monospace; font-size: 24px; line-height: 32px; color: #A99BBE; letter-spacing: 2px">{{league}}</span>
        <span style="font-family: 'Roboto Mono', monospace; font-size: 28px; line-height: 36px; font-weight: 500; white-space: nowrap">{{detail}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"away":{"editor":"text","default":"Washington Commanders"},"home":{"editor":"text","default":"San Francisco 49ers"},"league":{"editor":"text","default":"NFL"},"status":{"editor":"enum","options":["scheduled","live","final","ungrouped"],"default":"scheduled"},"detail":{"editor":"text","default":"7:15 PM"},"focused":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F5E50A","options":["#F5E50A","#00E5FF","#FF2E88"]},"$preview":{"width":840,"height":188}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const status = p.status ?? 'scheduled';
    const focused = p.focused === true || p.focused === 'true';
    const accent = p.accent ?? '#F5E50A';
    const detailByStatus = { final: 'FINAL', ungrouped: '' };
    return {
      away: p.away ?? 'Washington Commanders',
      home: p.home ?? 'San Francisco 49ers',
      league: status === 'ungrouped' ? '' : (p.league ?? 'NFL'),
      detail: status in detailByStatus ? detailByStatus[status] : String(p.detail ?? '7:15 PM').toUpperCase(),
      accent: accent,
      isLive: status === 'live',
      isUngrouped: status === 'ungrouped',
      isMatchup: status !== 'ungrouped',
      opacity: status === 'final' ? 0.4 : 1,
      borderColor: focused ? accent : '#3A1E4F',
      borderWidth: focused ? '6px' : '2px',
      transform: focused ? 'scale(1.05)' : 'none'
    };
  }
}
</script>
</body>
</html>
