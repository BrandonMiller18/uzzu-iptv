<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feed picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75..100,400..700&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #000000; color: #E6F0F2; font-family: Roboto, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <dc-import name="Games" focus-index="{{3}}" accent="{{accent}}" hint-size="1920px,1080px"></dc-import>
  </div>

  <div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(0, 0, 0, 0.88); display: flex; align-items: center; justify-content: center">
    <div style="width: 780px; padding: 2px; background: #3A1E4F; clip-path: polygon(0 0, calc(100% - 32px) 0, 100% 32px, 100% 100%, 32px 100%, 0 calc(100% - 32px))">
      <div role="dialog" aria-label="Choose a broadcast" style="box-sizing: border-box; padding: 40px 48px 44px; background: #0E0E11; clip-path: polygon(0 0, calc(100% - 31px) 0, 100% 31px, 100% 100%, 31px 100%, 0 calc(100% - 31px)); display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: 'Roboto Mono', monospace; font-size: 24px; line-height: 32px; color: #A99BBE; letter-spacing: 2px">// SELECT SIGNAL · 7:15 PM</span>
          <h2 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; font-stretch: 80%; letter-spacing: 2px; text-transform: uppercase">Washington Commanders @ San Francisco 49ers</h2>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <button style="height: 104px; padding: 6px; border: 0; background: {{accent}}; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); transform: scale(1.05); font-family: Roboto, sans-serif">
            <span style="width: 100%; height: 100%; box-sizing: border-box; padding: 0 24px; background: #000000; clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px); color: #E6F0F2; text-align: left; display: flex; align-items: center; gap: 20px">
              <span style="font-family: 'Roboto Mono', monospace; font-size: 24px; line-height: 32px; color: #A99BBE">A</span>
              <span style="display: flex; flex-direction: column">
                <span style="font-size: 28px; line-height: 36px; font-weight: 700; font-stretch: 80%; letter-spacing: 2px; text-transform: uppercase">Home feed</span>
                <span style="font-size: 24px; line-height: 32px; color: #A99BBE">San Francisco 49ers broadcast</span>
              </span>
            </span>
          </button>
          <button style="height: 104px; padding: 2px; border: 0; background: #3A1E4F; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); font-family: Roboto, sans-serif">
            <span style="width: 100%; height: 100%; box-sizing: border-box; padding: 0 28px; background: #000000; clip-path: polygon(13px 0, 100% 0, 100% calc(100% - 13px), calc(100% - 13px) 100%, 0 100%, 0 13px); color: #E6F0F2; text-align: left; display: flex; align-items: center; gap: 20px">
              <span style="font-family: 'Roboto Mono', monospace; font-size: 24px; line-height: 32px; color: #A99BBE">B</span>
              <span style="display: flex; flex-direction: column">
                <span style="font-size: 28px; line-height: 36px; font-weight: 700; font-stretch: 80%; letter-spacing: 2px; text-transform: uppercase">Away feed</span>
                <span style="font-size: 24px; line-height: 32px; color: #A99BBE">Washington Commanders broadcast</span>
              </span>
            </span>
          </button>
        </div>
        <span style="display: flex; align-items: center; gap: 12px; font-family: 'Roboto Mono', monospace; font-size: 24px; line-height: 32px; color: #A99BBE"><span style="border: 2px solid #3A1E4F; padding: 0 10px; color: #E6F0F2">BACK</span>CANCEL</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5E50A","options":["#F5E50A","#00E5FF","#FF2E88"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5E50A' };
  }
}
</script>
</body>
</html>
